plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'dev.hoduj.iotpasslite'
    compileSdk 36

    defaultConfig {
        applicationId "dev.hoduj.iotpasslite"
        // Android 12+ only: lets BLUETOOTH_SCAN be declared with neverForLocation, so this
        // app never has to ask for (or hold) any location permission.
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    if (signingPropertiesFile.isFile()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPropertiesFile.isFile()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!signingPropertiesFile.isFile()) {
            throw new GradleException(
                    "Missing signing.properties. Configure the local release signing key before building a release."
            )
        }

        def requiredProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        def missingProperties = requiredProperties.findAll {
            !signingProperties.getProperty(it)?.trim()
        }
        if (!missingProperties.isEmpty()) {
            throw new GradleException(
                    "Missing required properties in signing.properties: ${missingProperties.join(', ')}"
            )
        }

        def keystoreFile = rootProject.file(signingProperties.getProperty('storeFile'))
        if (!keystoreFile.isFile()) {
            throw new GradleException("Release keystore not found: ${keystoreFile}")
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('verifyReleaseSigning')
    }
}
